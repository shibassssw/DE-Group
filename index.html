<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER // CHAT</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0a0c10;
      --card-bg: #12161f;
      --accent-color: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.3);
      --text-color: #e0e6ed;
      --text-dim: #6272a4;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px var(--accent-glow);
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .chat-header h1 {
      font-size: 1.2rem;
      color: var(--accent-color);
      text-shadow: 0 0 5px var(--accent-glow);
      letter-spacing: 2px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ff5555;
      border-radius: 50%;
    }

    .dot.connected {
      background-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-color);
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 0.95rem;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message .time { color: var(--text-dim); font-size: 0.8rem; margin-right: 8px; }
    .message .username { color: var(--accent-color); font-weight: bold; margin-right: 8px; }
    .message.system { color: var(--text-dim); font-style: italic; }

    /* Vorschaubild für gesendete Medien */
    .chat-media-preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      margin-top: 6px;
      display: block;
    }

    .chat-input-area {
      padding: 15px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 15px;
      border-radius: 4px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 5px var(--accent-glow);
    }

    .file-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .file-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 0 5px var(--accent-glow);
    }

    button {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--accent-color);
      color: var(--bg-color);
      box-shadow: 0 0 10px var(--accent-color);
    }

    /* Modal Overlay für Username */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 12, 16, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: var(--card-bg);
      padding: 30px;
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 15px var(--accent-glow);
      text-align: center;
    }

    .modal h2 {
      color: var(--accent-color);
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .modal input {
      width: 100%;
      margin-bottom: 15px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Username Modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h2>IDENTIFIKATION ERFORDERLICH</h2>
      <input type="text" id="username-input" placeholder="Rufnamen eingeben..." maxlength="20" autofocus>
      <button id="join-btn">BETRETEN</button>
    </div>
  </div>

  <!-- Main Chat UI -->
  <div class="chat-container">
    <div class="chat-header">
      <h1>[ GLOBAL_NET // CHAT ]</h1>
      <div class="status-indicator">
        <div id="status-dot" class="dot"></div>
        <span id="status-text">OFFLINE</span>
      </div>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message system">Verbindung zum Netzwerk wird hergestellt...</div>
    </div>

    <form class="chat-input-area" id="chat-form">
      <label class="file-btn" title="Bild auswählen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <input type="file" id="media-input" accept="image/*" style="display: none;">
      </label>
      <input type="text" id="message-input" placeholder="Nachricht eingeben..." autocomplete="off">
      <button type="submit">SENDEN</button>
    </form>
  </div>

  <script>
    // Initialisierung des anonymen Supabase Clients
const supabaseClient = supabase.createClient(
        'https://bfrobhpkonddsngdjzmn.supabase.co',
      'sb_publishable_rPwNv6-CbK_93k84NJMo8w_Wtv81jcF'
    );

    let currentUsername = localStorage.getItem("chat_username");
    const modalOverlay = document.getElementById("modal-overlay");
    const usernameInput = document.getElementById("username-input");
    const joinBtn = document.getElementById("join-btn");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const mediaInput = document.getElementById("media-input");
    const messagesContainer = document.getElementById("messages");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    // Username Logik
    if (currentUsername) {
      modalOverlay.classList.add("hidden");
    }

    joinBtn.addEventListener("click", saveUsername);
    usernameInput.addEventListener("keypress", (e) => { if (e.key === "Enter") saveUsername(); });

    function saveUsername() {
      const val = usernameInput.value.trim();
      if (val) {
        currentUsername = val;
        localStorage.setItem("chat_username", currentUsername);
        modalOverlay.classList.add("hidden");
        addSystemMessage(`Willkommen, ${currentUsername}.`);
      }
    }

    // Supabase Realtime Channel
    const channel = supabaseClient.channel('global-chat', {
      config: { broadcast: { self: true } }
    });

    channel
      .on('broadcast', { event: 'shout' }, ({ payload }) => {
        appendMessage(payload);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          statusDot.classList.add("connected");
          statusText.textContent = "ONLINE";
          addSystemMessage("Verbindung mit dem globalen Knotenpunkt hergestellt.");
        }
      });

    // Nachricht senden
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentUsername) return;

      sendBroadcastPayload(text);
      messageInput.value = "";
    });

    // Bild hochladen / senden per Broadcast
    mediaInput.addEventListener("change", () => {
      const file = mediaInput.files[0];
      if (!file || !currentUsername) return;

      if (file.size > 2 * 1024 * 1024) {
        alert("Bild ist zu groß für Direktübertragung. Max. 2MB.");
        mediaInput.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        sendBroadcastPayload(`[IMG]:${e.target.result}`);
        mediaInput.value = "";
      };
      reader.readAsDataURL(file);
    });

    function sendBroadcastPayload(textData) {
      const payload = {
        username: currentUsername,
        text: textData,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      channel.send({
        type: 'broadcast',
        event: 'shout',
        payload: payload
      });
    }

    function appendMessage(data) {
      const msgEl = document.createElement("div");
      msgEl.className = "message";

      if (data.text.startsWith("[IMG]:")) {
        const imageUrl = data.text.replace("[IMG]:", "");
        msgEl.innerHTML = `<span class="time">[${data.time}]</span><span class="username">&lt;${escapeHTML(data.username)}&gt;</span><br><img src="${imageUrl}" class="chat-media-preview" />`;
      } else {
        msgEl.innerHTML = `<span class="time">[${data.time}]</span><span class="username">&lt;${escapeHTML(data.username)}&gt;</span> ${escapeHTML(data.text)}`;
      }

      messagesContainer.appendChild(msgEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addSystemMessage(text) {
      const msgEl = document.createElement("div");
      msgEl.className = "message system";
      msgEl.textContent = `> ${text}`;
      messagesContainer.appendChild(msgEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
